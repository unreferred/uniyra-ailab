# Single HTTP entrypoint for the Docker installation.
# - /           SPA static build (client-side routing via index.html fallback)
# - /api/       reverse-proxied to the backend (never publicly exposed itself)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Attachments / project files uploads
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agentic / research runs can stream for minutes: disable buffering
        # and keep the connection open well beyond provider ceilings.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
